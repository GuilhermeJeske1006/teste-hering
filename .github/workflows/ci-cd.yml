# CI/CD da Mesa de Alocação (ADRs 0014 e 0015).
# CI: em pull request e no push da branch padrão roda as mesmas validações das skills (testes, SOLID, layout e fluxos E2E).
# CD: toda execução builda a imagem e faz smoke test e varredura; só a branch padrão (ou uma tag v*) publica no GHCR.
# As actions são fixadas por SHA (o comentário diz a versão); o Dependabot propõe as atualizações.
name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Em PR, um push novo cancela a execução anterior; na branch padrão e em tags, nunca interrompe uma publicação.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PYTHON: python
  FORCE_COLOR: "1"

jobs:
  testes:
    name: Testes (lint, tipos, unit, feature/golden, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
          npm ci --prefix frontend --no-audit --no-fund

      - name: Suíte da skill validar-testes
        run: bash .claude/skills/validar-testes/scripts/run_tests.sh

      - name: Resumo
        if: always()
        run: test -f reports/tests.md && cat reports/tests.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Logs das etapas que falharam
        if: failure()
        run: |
          for log in reports/test-*.log; do
            echo "::group::$log"; cat "$log"; echo "::endgroup::"
          done

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorio-testes
          path: reports/
          if-no-files-found: ignore

      - name: Guardar build do frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: backend/app/static/
          if-no-files-found: error

  solid:
    name: Arquitetura e SOLID
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: check_architecture.py
        run: |
          python .claude/skills/revisar-solid/scripts/check_architecture.py backend/app | tee solid.md
          cat solid.md >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Layout e fluxos E2E (Playwright)
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências e Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
          python -m playwright install --with-deps chromium

      - name: Baixar build do frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: backend/app/static/

      - name: Validação de layout (skill validar-layout)
        run: |
          export MESA_DB_PATH="$RUNNER_TEMP/layout.db"
          (cd backend && python -m uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &)
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 0.5; done
          curl -fs http://127.0.0.1:8000/api/health > /dev/null \
            || { echo "::error::O monolito não subiu em 30 s"; exit 1; }
          python .claude/skills/validar-layout/scripts/validate_layout.py --url http://127.0.0.1:8000 --out reports/layout
          pkill -f "uvicorn app.main:app --port 8000" || true

      - name: Log do monolito
        if: failure()
        run: |
          echo "::group::uvicorn.log"; cat "$RUNNER_TEMP/uvicorn.log" || true; echo "::endgroup::"

      - name: Fluxos E2E (skill validar-fluxo)
        if: always()
        run: python .claude/skills/validar-fluxo/scripts/validate_flows.py --out reports/flows

      - name: Resumo
        if: always()
        run: |
          for f in reports/layout/layout.md reports/flows/flows.md; do
            [ -f "$f" ] && { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - name: Guardar relatórios e capturas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relatorio-e2e
          path: reports/
          if-no-files-found: ignore

  imagem:
    name: CD · Imagem (build, smoke test, varredura e publicação no GHCR)
    needs: [testes, solid, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: mesa-alocacao:ci
      PUBLISH: >-
        ${{ github.event_name == 'push' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local da imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (healthcheck, SPA, modo sombra, não-root, sem chave)
        run: make docker-smoke IMAGE="$IMAGE"

      - name: Varredura de vulnerabilidades (Trivy)
        run: make docker-scan IMAGE="$IMAGE"

      - name: Login no GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # Mesmo builder e mesmo cache do build testado acima: as camadas publicadas são as que passaram no smoke test.
      - name: Publicar no GHCR
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Resumo
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagem publicada"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
